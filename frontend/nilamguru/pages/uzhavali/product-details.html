<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Details — NilamGuru</title>
<link rel="stylesheet" href="../../css/style.css" />
<link rel="stylesheet" href="../../css/components.css" />
<link rel="stylesheet" href="../../css/pages.css" />
<link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body data-role="uzhavali" data-page="marketplace">

<div id="app-header"></div>
<div class="app-shell">
    <nav id="app-sidebar"></nav>
    <main class="app-main">
        <div class="app-content" id="content">
            <div class="loading-block"><span class="loading-spinner dark"></span></div>
        </div>
    </main>
</div>
<div id="app-bottomnav"></div>

<!-- Enquiry modal -->
<div class="modal-overlay" id="enquiry-modal">
    <div class="modal">
        <div class="modal-header">
            <h3 style="margin:0">Send Enquiry</h3>
            <button class="modal-close" id="close-modal" aria-label="Close">✕</button>
        </div>
        <form id="enquiry-form" novalidate>
            <div class="form-group">
                <label class="form-label">Quantity</label>
                <input class="form-control" type="number" id="enquiry-qty" min="1" value="1" />
            </div>
            <div class="form-group">
                <label class="form-label">Message</label>
                <textarea class="form-control" id="enquiry-message" rows="4" placeholder="Any details for the seller..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="send-enquiry-btn">Send Enquiry</button>
        </form>
    </div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/validation.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/navigation.js"></script>
<script src="../../js/uzhavali/product.js"></script>
</body>
</html>
