<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — NilamGuru</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/pages.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand"><span class="leaf">🌱</span> NilamGuru</div>
        <h2 class="auth-title text-center">Reset your password</h2>
        <p class="auth-sub">Enter your email or phone and we'll send you a reset code</p>

        <form id="forgot-form" novalidate>
            <div class="form-group">
                <label class="form-label" for="identifier">Email or Phone</label>
                <input class="form-control" type="text" id="identifier" placeholder="you@example.com or 9876543210" />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Send Reset Code</button>
        </form>

        <p class="auth-footer"><a href="login.html">← Back to Login</a></p>

        <div class="demo-note">
            ℹ️ Password reset is <strong>demo mode</strong> — no email/SMS is actually sent yet.
        </div>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/validation.js"></script>
<script>
    document.getElementById("forgot-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const identifierEl = document.getElementById("identifier");
        const valid = validateForm([
            { el: identifierEl, rules: [[isRequired, "Email or phone is required."], [isEmailOrPhone, "Enter a valid email or 10-digit phone."]] }
        ]);
        if (!valid) return;

        const btn = document.getElementById("reset-btn");
        setButtonLoading(btn, "Sending...");
        setTimeout(() => {
            resetButton(btn);
            showToast("Reset code sent (demo). Check the OTP page.", "success");
            setTimeout(() => (window.location.href = "otp.html"), 600);
        }, 700);
    });
</script>
</body>
</html>
