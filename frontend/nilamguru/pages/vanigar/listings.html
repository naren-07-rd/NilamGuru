<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Listings — NilamGuru</title>
<link rel="stylesheet" href="../../css/style.css" />
<link rel="stylesheet" href="../../css/components.css" />
<link rel="stylesheet" href="../../css/pages.css" />
<link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body data-role="vanigar" data-page="listings">

<div id="app-header"></div>
<div class="app-shell">
    <nav id="app-sidebar"></nav>
    <main class="app-main">
        <div class="app-content">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
                <h2 style="margin-bottom:0">📦 My Listings</h2>
                <a href="add-listing.html" class="btn btn-primary btn-sm">➕ Add Listing</a>
            </div>
            <div class="pending-banner">⚠️ Backend integration pending — listings are stored locally until listing APIs exist.</div>

            <div class="chip-row" id="tab-row" style="margin-bottom:18px">
                <button class="chip active" data-tab="all">All</button>
                <button class="chip" data-tab="active">Active</button>
                <button class="chip" data-tab="inactive">Inactive</button>
                <button class="chip" data-tab="sold_out">Sold Out</button>
            </div>

            <div class="data-table-wrap">
                <table class="data-table">
                    <thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
                    <tbody id="listings-table-body"></tbody>
                </table>
            </div>
            <div class="list-cards" id="listings-cards"></div>
        </div>
    </main>
</div>
<div id="app-bottomnav"></div>

<!-- Delete confirmation modal -->
<div class="modal-overlay" id="delete-modal">
    <div class="modal">
        <div class="modal-header"><h3 style="margin:0">Delete listing?</h3><button class="modal-close" id="close-delete-modal">✕</button></div>
        <p class="text-muted">This can't be undone. Are you sure you want to delete <strong id="delete-target-name"></strong>?</p>
        <div style="display:flex;gap:10px">
            <button class="btn btn-secondary btn-block" id="cancel-delete">Cancel</button>
            <button class="btn btn-danger btn-block" id="confirm-delete">Delete</button>
        </div>
    </div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/navigation.js"></script>
<script src="../../js/vanigar/listings.js"></script>
</body>
</html>
